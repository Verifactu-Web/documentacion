name: Validate documentation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Validate OpenAPI
        run: |
          ruby -ryaml -e "d=YAML.load_file('openapi/openapi.yaml'); abort unless d['openapi'].start_with?('3.'); abort unless d['paths'] && d['components'] && d['components']['schemas']; puts 'OpenAPI YAML válido y contiene paths/schemas'"
      - name: Render PlantUML
        run: |
          mkdir -p artifacts/diagrams
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            plantuml/plantuml:1.2025.10 \
            -Playout=smetana -tpng -o /workspace/artifacts/diagrams /workspace/diagrams
          test "$(find artifacts/diagrams -name '*.png' | wc -l)" -ge 12
      - name: Validate pairs and docs
        run: |
          test -s README.md
          test "$(find diagrams -name '*.puml' | wc -l)" -ge 12
          for f in diagrams/*.puml; do grep -q '^@startuml' "$f" && grep -q '^@enduml' "$f"; done
