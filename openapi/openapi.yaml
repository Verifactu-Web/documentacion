openapi: 3.0.3
info:
  title: Verifactu-Web API
  version: 0.1.0
  description: |
    Contrato inicial API-first para retail y hostelería. La remisión VERI*FACTU
    usa un adaptador hacia los servicios oficiales de AEAT; los esquemas fiscales
    finales deben alinearse con la versión técnica vigente antes de producción.
servers:
  - url: https://api.example.invalid/api/v1
    description: Placeholder; cada entorno publica su URL real.
tags:
  - name: Tenant
  - name: Catalog
  - name: Orders
  - name: Fiscal
  - name: Hospitality
  - name: Printing
  - name: Billing
paths:
  /me/tenants:
    get:
      tags: [Tenant]
      operationId: listMyTenants
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Tenants del usuario autenticado
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tenant' }
  /tenants/{tenantId}/products:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [Catalog]
      operationId: listProducts
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: cursor, schema: { type: string } }
        - { in: query, name: q, schema: { type: string } }
      responses:
        '200':
          description: Catálogo tenant-scoped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
    post:
      tags: [Catalog]
      operationId: createProduct
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '201':
          description: Producto creado
          content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } }
        '409': { $ref: '#/components/responses/Problem' }
  /tenants/{tenantId}/orders:
    parameters: [{ $ref: '#/components/parameters/TenantId' }]
    post:
      tags: [Orders]
      operationId: createOrder
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderInput' }
      responses:
        '201':
          description: Pedido creado
          content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } }
        '422': { $ref: '#/components/responses/Problem' }
  /tenants/{tenantId}/invoices:
    parameters: [{ $ref: '#/components/parameters/TenantId' }]
    post:
      tags: [Fiscal]
      operationId: issueInvoice
      description: Expide una factura; crea RF append-only y encola remisión VERI*FACTU.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - { in: header, name: X-Correlation-Id, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoiceInput' }
      responses:
        '201':
          description: Factura creada; la remisión puede estar pendiente
          content: { application/json: { schema: { $ref: '#/components/schemas/Invoice' } } }
        '409': { $ref: '#/components/responses/Problem' }
    get:
      tags: [Fiscal]
      operationId: listInvoices
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: cursor, schema: { type: string } }
        - { in: query, name: status, schema: { type: string, enum: [pending, accepted, rejected, voided] } }
      responses:
        '200':
          description: Facturas del tenant
          content: { application/json: { schema: { $ref: '#/components/schemas/InvoicePage' } } }
  /tenants/{tenantId}/invoices/{invoiceId}/void:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - { in: path, name: invoiceId, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Fiscal]
      operationId: voidInvoice
      description: Crea registro de anulación; nunca elimina la factura original.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/VoidInvoiceInput' } } }
      responses:
        '202':
          description: Anulación encolada
          content: { application/json: { schema: { $ref: '#/components/schemas/FiscalStatus' } } }
        '409': { $ref: '#/components/responses/Problem' }
  /tenants/{tenantId}/fiscal/submissions/{submissionId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - { in: path, name: submissionId, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Fiscal]
      operationId: getFiscalSubmission
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Estado y acuse sanitizado de AEAT
          content: { application/json: { schema: { $ref: '#/components/schemas/FiscalStatus' } } }
  /tenants/{tenantId}/tables/{tableId}/orders:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - { in: path, name: tableId, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Hospitality]
      operationId: createTableOrder
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OrderInput' } } }
      responses:
        '201':
          description: Pedido QR/mesa creado
          content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } }
  /tenants/{tenantId}/print-jobs:
    parameters: [{ $ref: '#/components/parameters/TenantId' }]
    post:
      tags: [Printing]
      operationId: createPrintJob
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PrintJobInput' } } }
      responses:
        '202':
          description: Trabajo de impresión encolado
          content: { application/json: { schema: { $ref: '#/components/schemas/PrintJob' } } }
  /tenants/{tenantId}/billing/usage:
    parameters: [{ $ref: '#/components/parameters/TenantId' }]
    get:
      tags: [Billing]
      operationId: getUsage
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Uso y entitlements actuales
          content: { application/json: { schema: { $ref: '#/components/schemas/Usage' } } }
components:
  parameters:
    TenantId:
      in: path
      name: tenantId
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
  responses:
    Problem:
      description: RFC 7807 problem
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Tenant:
      type: object
      required: [id, name, mode]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        mode: { type: string, enum: [retail, hospitality, hybrid] }
    ProductInput:
      type: object
      required: [sku, name, taxCode]
      properties:
        sku: { type: string }
        name: { type: string }
        taxCode: { type: string }
        price: { type: string, pattern: '^[0-9]+(\\.[0-9]{1,4})?$' }
        allergens: { type: array, items: { type: string } }
    Product:
      allOf:
        - $ref: '#/components/schemas/ProductInput'
        - type: object
          required: [id]
          properties: { id: { type: string, format: uuid } }
    ProductPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Product' } }
        nextCursor: { type: string, nullable: true }
    OrderLineInput:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: string, format: uuid }
        quantity: { type: number, format: double, minimum: 0.001 }
        modifiers: { type: array, items: { type: string, format: uuid } }
        note: { type: string, maxLength: 500 }
    OrderInput:
      type: object
      required: [locationId, lines]
      properties:
        locationId: { type: string, format: uuid }
        tableId: { type: string, format: uuid, nullable: true }
        lines: { type: array, minItems: 1, items: { $ref: '#/components/schemas/OrderLineInput' } }
    Order:
      type: object
      required: [id, status, total]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [draft, pending, confirmed, ready, paid, cancelled] }
        total: { type: string }
    InvoiceInput:
      type: object
      required: [orderId, invoiceType, series]
      properties:
        orderId: { type: string, format: uuid }
        invoiceType: { type: string, enum: [F1, F2, F3, R1, R2, R3, R4, R5] }
        series: { type: string }
        recipient:
          type: object
          properties:
            nif: { type: string }
            name: { type: string }
            address: { type: string }
    Invoice:
      type: object
      required: [id, series, number, fiscalStatus]
      properties:
        id: { type: string, format: uuid }
        series: { type: string }
        number: { type: string }
        fiscalStatus: { $ref: '#/components/schemas/FiscalStatus' }
        qrUrl: { type: string, format: uri }
    InvoicePage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Invoice' } }
        nextCursor: { type: string, nullable: true }
    VoidInvoiceInput:
      type: object
      required: [reason]
      properties: { reason: { type: string, minLength: 3, maxLength: 500 } }
    FiscalStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [pending, submitted, accepted, rejected, contingency, reconciled] }
        submissionId: { type: string, format: uuid, nullable: true }
        responseCode: { type: string, nullable: true }
        submittedAt: { type: string, format: date-time, nullable: true }
    PrintJobInput:
      type: object
      required: [deviceId, kind, artifactId]
      properties:
        deviceId: { type: string, format: uuid }
        kind: { type: string, enum: [invoice, kitchen, kds, receipt] }
        artifactId: { type: string, format: uuid }
    PrintJob:
      allOf:
        - $ref: '#/components/schemas/PrintJobInput'
        - type: object
          required: [id, status]
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [queued, printing, printed, failed] }
    Usage:
      type: object
      properties:
        plan: { type: string }
        entitlements: { type: object, additionalProperties: { type: boolean } }
        meters: { type: object, additionalProperties: { type: integer, minimum: 0 } }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        correlationId: { type: string }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
